openapi: 3.0.1
info:
  version: 1.0.0
  title: MiniHackerNews API
  contact:
    name: Ravid Gontov
tags:
  - name: mhn
    description: MiniHackerNews endpoints

paths:
  /mhn/posts:
    get:
      tags:
        - mhn
      summary: Get all posts
      description: Returns a list of all posts
      operationId: getPosts
      responses:
        '200':
          description: A list of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDTO'
      

components:
  schemas:
    # PostDAO:
    #   x-class-extra-annotation: |
    #     @lombok.AllArgsConstructor
    #     @lombok.NoArgsConstructor
    #   properties:
    #     id:
    #       type: integer
    #       format: int64
    #     content:
    #       type: string

    PostDTO:
      properties:
        id:
          type: integer
          format: int64
        content:
          type: string

    ErrorResponseDTO:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          format: int32
        error: 
          type: string
        exception:
          type: string
        message: 
          type: string
        path:
          type: string